name: Release apihub-ddl-import

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize release version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver: ${{ inputs.version }}" >&2
            exit 1
          fi
          echo "tag=apihub-ddl-import/v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=v${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v4
        with:
          go-version-file: apihub-ddl-import/go.mod

      - name: Test
        run: cd ./apihub-ddl-import && go test -v ./...

      - name: Build Linux
        run: >
          cd ./apihub-ddl-import && go build -v
          -ldflags "-X apihub-ddl-import/internal/report.ToolVersion=${{ steps.version.outputs.name }}"
          -o apihub-ddl-import .
        env:
          GOOS: linux
          GOARCH: amd64

      - name: Build Windows
        run: >
          cd ./apihub-ddl-import && go build -v
          -ldflags "-X apihub-ddl-import/internal/report.ToolVersion=${{ steps.version.outputs.name }}"
          -o apihub-ddl-import.exe .
        env:
          GOOS: windows
          GOARCH: amd64

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: apihub-ddl-import ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            apihub-ddl-import/apihub-ddl-import
            apihub-ddl-import/apihub-ddl-import.exe
